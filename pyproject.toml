[project]
name = "infra-netbox-management"
version = "0.1.0"
description = "Gestión automatizada e ingesta de infraestructura NetBox"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0.3",
    "paramiko>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netbox_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
]
